---
name: Build AppImage Builder
"on":
  push:
    branches:
      - master
    paths:
      - "deploy/appimage/**"
  workflow_dispatch: {}

concurrency:
  group: shared-appimage-build-lane
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: code.dawn.org.in
          username: ${{ vars.maintainer}}
          password: ${{ secrets.TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          endpoint: "/run/user/1000/podman/podman.sock"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: deploy/appimage
          platforms: linux/amd64,linux/arm64,linux/i386,linux/armhf
          file: Containerfile
          push: true
          tags: code.dawn.org.in/flamboyantpenguin/appimager-wikilynx:latest
