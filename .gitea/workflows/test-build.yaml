---
name: Build Test
"on":
  pull_request:
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - ".gitea/workflows/test-build.yaml"

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:13
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            qt: 6
            platform: linux
            packages: "qt6-base-dev qt6-webengine-dev qt6-multimedia-dev"

    name: Build Test Qt${{ matrix.qt }}
    steps:
      - name: Install Qt
        if: ${{ matrix.platform == 'linux' }}
        run: |
          apt update && apt upgrade -y
          apt install -y \
          nodejs build-essential cmake ninja-build ${{ matrix.packages }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja

      - name: Build and Install
        run: |
          cmake --build build --parallel
          cmake --install build
